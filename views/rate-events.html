<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rate Candidates</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            color: white;
            text-align: center;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            background: rgba(255, 255, 255, 0.2);
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            backdrop-filter: blur(10px);
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            color: #ffcc00;
        }

        nav ul {
            list-style: none;
            display: flex;
        }

        nav ul li {
            margin: 0 15px;
        }

        nav ul li a {
            color: white;
            text-decoration: none;
            font-size: 18px;
            transition: 0.3s;
        }

        nav ul li a:hover,
        nav ul li a.active {
            color: #ffcc00;
        }

        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            width: 100%;
        }

        .dashboard-box {
            background: rgba(255, 255, 255, 0.15);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            width: 80%;
            max-width: 900px;
            min-height: 400px;
        }

        h2 {
            font-size: 28px;
            color: #ffcc00;
            margin-bottom: 15px;
        }

        table {
            width: 100%;
            margin-top: 20px;
            border-collapse: collapse;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            overflow: hidden;
        }

        th, td {
            padding: 12px;
            border: 1px solid white;
            text-align: center;
        }

        th {
            background: rgba(255, 255, 255, 0.3);
            color: #ffcc00;
        }

        td {
            background: rgba(255, 255, 255, 0.1);
        }

        tr:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .btn-rate {
            padding: 8px 12px;
            background: #ffcc00;
            color: black;
            border: none;
            cursor: pointer;
            border-radius: 5px;
            transition: 0.3s;
            font-size: 14px;
        }

        .btn-rate:hover {
            background: #e6b800;
        }

        footer {
            text-align: center;
            padding: 15px;
            font-size: 14px;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            width: 100%;
            margin-top: auto;
        }
    </style>
</head>

<body>

    <header>
        <div class="logo">Event Rating System</div>
        <nav>
            <ul>
                <li><a href="/judge/dashboard">Dashboard</a></li>
                <li><a href="/logout">Logout</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <div class="dashboard-box">
            <h2 id="eventTitle">Rate Candidates</h2>

            <table>
                <thead>
                    <tr>
                        <th>Candidate Name</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="candidatesTable"></tbody>
            </table>
        </div>
    </main>

    <footer>
        <p>&copy; 2025 Event Rating System. All Rights Reserved.</p>
    </footer>

    <script>
        document.addEventListener("DOMContentLoaded", async () => {
            try {
                const judgeResponse = await fetch('/api/judge-info');
                if (!judgeResponse.ok) throw new Error("Failed to fetch judge info");
    
                const { judgeId } = await judgeResponse.json();
                console.log("✅ Logged-in Judge ID:", judgeId);
    
                const urlParams = new URLSearchParams(window.location.search);
                let eventId = urlParams.get("eventId");
    
                if (!eventId) {
                    console.error("❌ Event ID is missing. Redirecting...");
                    window.location.href = "/judge/dashboard";
                    return;
                }
    
                await fetchCandidates(eventId, judgeId);
            } catch (error) {
                console.error("❌ Error fetching judge info:", error);
            }
        });
    
        async function fetchCandidates(eventId, judgeId) {
            try {
                console.log(`🔍 Fetching candidates for Event ${eventId} and Judge ${judgeId}`);
    
                const response = await fetch(`/api/event/${eventId}/candidates?judgeId=${judgeId}`);
                if (!response.ok) throw new Error("Failed to fetch candidates");
    
                const candidates = await response.json();
                console.log("✅ Candidates received from API:", candidates);
    
                const table = document.getElementById("candidatesTable");
    
                // 🔥 Ensure the table is updated correctly
                table.innerHTML = "";
    
                // 🔥 Only show candidates that the judge has NOT rated
                const unratedCandidates = candidates.filter(candidate => !candidate.alreadyRated);
    
                if (unratedCandidates.length === 0) {
                    console.warn("⚠ No more unrated candidates available.");
                    table.innerHTML = '<tr><td colspan="2" style="color:#ffcc00;">No more candidates available for rating.</td></tr>';
                    return;
                }
    
                // 🔥 Display only unrated candidates
                unratedCandidates.forEach(candidate => {
                    table.innerHTML += `
                        <tr id="candidate-${candidate.id}">
                            <td>${candidate.name}</td>
                            <td><button class="btn-rate" onclick="rateCandidate('${candidate.id}', '${eventId}')">Rate</button></td>
                        </tr>
                    `;
                });
    
            } catch (error) {
                console.error("❌ Error fetching candidates:", error);
                document.getElementById("candidatesTable").innerHTML = '<tr><td colspan="2">Error loading candidates.</td></tr>';
            }
        }
    
        function rateCandidate(candidateId, eventId) {
            if (!candidateId || !eventId) {
                alert("Candidate or Event ID is missing!");
                return;
            }
    
            console.log("📌 Redirecting to rate.html with eventId:", eventId, "candidateId:", candidateId);
            localStorage.setItem("lastRatedCandidate", candidateId); // Store last rated candidate ID
    
            window.location.href = `/rate.html?eventId=${eventId}&candidateId=${candidateId}`;
        }
    
        document.addEventListener("DOMContentLoaded", () => {
            const lastRatedCandidate = localStorage.getItem("lastRatedCandidate");
            if (lastRatedCandidate) {
                const candidateRow = document.getElementById(`candidate-${lastRatedCandidate}`);
                if (candidateRow) {
                    candidateRow.remove();
                    console.log(`✅ Removed candidate ${lastRatedCandidate} from list`);
                }
                localStorage.removeItem("lastRatedCandidate");
            }
        });
    </script>
    
    

</body>
</html>
