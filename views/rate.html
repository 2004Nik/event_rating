<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rate Candidate</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #141E30, #243B55);
            color: white;
            text-align: center;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            justify-content: flex-start;
            align-items: center;
            padding: 20px;
            overflow-y: auto;
        }

        .header {
            width: 100%;
            max-width: 600px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            position: fixed;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            backdrop-filter: blur(10px);
            z-index: 1000;
        }

        .header a {
            text-decoration: none;
            color: white;
            font-size: 16px;
            font-weight: bold;
            padding: 10px 15px;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.2);
            transition: 0.3s;
        }

        .header a:hover {
            background: rgba(255, 255, 255, 0.4);
        }

        .container {
            margin-top: 80px;
            width: 100%;
            max-width: 550px;
        }

        .rating-box {
            background: rgba(255, 255, 255, 0.1);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
            text-align: center;
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        h2 {
            font-size: 28px;
            color: #ffcc00;
            margin-bottom: 15px;
        }

        .candidate-name {
            font-size: 22px;
            font-weight: bold;
            color: #ffcc00;
            text-transform: uppercase;
            background: rgba(255, 255, 255, 0.15);
            padding: 10px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: inline-block;
            box-shadow: 0 4px 10px rgba(255, 204, 0, 0.5);
        }

        .rating-category {
            margin: 15px 0 8px;
            font-size: 18px;
            font-weight: bold;
            color: white;
        }

        .stars {
            display: flex;
            justify-content: center;
            gap: 6px;
            margin-top: 5px;
            direction: rtl;
        }

        .stars input {
            display: none;
        }

        .stars label {
            font-size: 28px;
            color: #bbb;
            cursor: pointer;
            transition: 0.3s ease-in-out;
        }

        .stars input:checked ~ label,
        .stars label:hover,
        .stars label:hover ~ label {
            color: #ffcc00;
        }

        .btn-submit {
            margin-top: 20px;
            padding: 12px 25px;
            background: #ffcc00;
            color: black;
            border: none;
            cursor: pointer;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            transition: 0.3s;
        }

        .btn-submit:hover {
            background: #e6b800;
        }
    </style>
</head>
<body>

    <div class="header">
        <a href="/rate-events">🏠 Dashboard</a>
        <a href="/logout">🚪 Logout</a>
    </div>

    <div class="container">
        <div class="rating-box">
            <h2>Rate Candidate</h2>
            <div class="candidate-name" id="candidateName">Loading...</div>

            <form id="ratingForm">
                <div class="rating-category">Performance</div>
                <div class="stars">
                    <input type="radio" name="performance" value="5" id="p5"><label for="p5">★</label>
                    <input type="radio" name="performance" value="4" id="p4"><label for="p4">★</label>
                    <input type="radio" name="performance" value="3" id="p3"><label for="p3">★</label>
                    <input type="radio" name="performance" value="2" id="p2"><label for="p2">★</label>
                    <input type="radio" name="performance" value="1" id="p1"><label for="p1">★</label>
                </div>
            
                <div class="rating-category">Presentation</div>
                <div class="stars">
                    <input type="radio" name="presentation" value="5" id="pre5"><label for="pre5">★</label>
                    <input type="radio" name="presentation" value="4" id="pre4"><label for="pre4">★</label>
                    <input type="radio" name="presentation" value="3" id="pre3"><label for="pre3">★</label>
                    <input type="radio" name="presentation" value="2" id="pre2"><label for="pre2">★</label>
                    <input type="radio" name="presentation" value="1" id="pre1"><label for="pre1">★</label>
                </div>
            
                <div class="rating-category">Time</div>
                <div class="stars">
                    <input type="radio" name="time" value="5" id="t5"><label for="t5">★</label>
                    <input type="radio" name="time" value="4" id="t4"><label for="t4">★</label>
                    <input type="radio" name="time" value="3" id="t3"><label for="t3">★</label>
                    <input type="radio" name="time" value="2" id="t2"><label for="t2">★</label>
                    <input type="radio" name="time" value="1" id="t1"><label for="t1">★</label>
                </div>
            
                <div class="rating-category">Engagement</div>
                <div class="stars">
                    <input type="radio" name="engagement" value="5" id="e5"><label for="e5">★</label>
                    <input type="radio" name="engagement" value="4" id="e4"><label for="e4">★</label>
                    <input type="radio" name="engagement" value="3" id="e3"><label for="e3">★</label>
                    <input type="radio" name="engagement" value="2" id="e2"><label for="e2">★</label>
                    <input type="radio" name="engagement" value="1" id="e1"><label for="e1">★</label>
                </div>
            
                <button type="submit" class="btn-submit">Submit Rating</button>
            </form>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", async () => {
            const urlParams = new URLSearchParams(window.location.search);
            const candidateId = urlParams.get("candidateId");
            const eventId = urlParams.get("eventId");
        
            if (!candidateId || !eventId) {
                alert("Missing event or candidate ID. Redirecting...");
                window.location.href = "/rate-events";
                return;
            }
        
            try {
                const response = await fetch(`/api/candidate/${candidateId}`);
                if (!response.ok) throw new Error(`Failed to fetch candidate data. Status: ${response.status}`);
        
                const candidate = await response.json();
                document.getElementById("candidateName").textContent = candidate.name || "Candidate not found.";
            } catch (error) {
                console.error("Error fetching candidate:", error);
                document.getElementById("candidateName").textContent = "Failed to load candidate details.";
            }
        });
        
        document.getElementById("ratingForm").addEventListener("submit", async function (event) {
            event.preventDefault();
        
            const urlParams = new URLSearchParams(window.location.search);
            const eventId = urlParams.get("eventId");
            const candidateId = urlParams.get("candidateId");
        
            if (!eventId || !candidateId) {
                alert("Missing event or candidate information.");
                return;
            }
        
            const performance = document.querySelector('input[name="performance"]:checked')?.value;
            const presentation = document.querySelector('input[name="presentation"]:checked')?.value;
            const time = document.querySelector('input[name="time"]:checked')?.value;
            const engagement = document.querySelector('input[name="engagement"]:checked')?.value;
        
            if (!performance || !presentation || !time || !engagement) {
                alert("All rating fields are required.");
                return;
            }
        
            try {
                const response = await fetch("/api/rate-candidate", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ eventId, candidateId, performance, presentation, time, engagement }),
                });
        
                if (!response.ok) {
                    const errorText = await response.text();
                    throw new Error(`Failed to submit rating. Server says: ${errorText}`);
                }
        
                // Fetch next candidate for rating
                const nextResponse = await fetch(`/api/event/${eventId}/next-candidate`);
                if (!nextResponse.ok) {
                    alert("No more candidates to rate.");
                    window.location.href = "/rate-events";
                    return;
                }
        
                const nextCandidate = await nextResponse.json();
                
                // Redirect to the next candidate
                if (nextCandidate.id) {
                    window.location.href = `/rate.html?eventId=${eventId}&candidateId=${nextCandidate.id}`;
                } else {
                    alert("No more candidates left to rate.");
                    window.location.href = "/rate-events";
                }
            } catch (error) {
                console.error("Error submitting rating:", error);
                alert("Failed to submit rating. Please try again.");
            }
        });
        </script>
        
</body>
</html>
