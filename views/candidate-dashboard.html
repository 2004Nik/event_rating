<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Candidate Dashboard</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { 
            background: linear-gradient(135deg, #1e3c72, #2a5298); 
            color: white; 
            text-align: center; 
            min-height: 100vh; 
            display: flex;
            flex-direction: column;
        }
        header { 
            background: rgba(255, 255, 255, 0.2); 
            padding: 15px 30px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            backdrop-filter: blur(10px); 
        }
        .logo { font-size: 24px; font-weight: bold; color: #ffcc00; }
        nav ul { list-style: none; display: flex; }
        nav ul li { margin: 0 15px; position: relative; }
        nav ul li a { color: white; text-decoration: none; font-size: 18px; transition: 0.3s; }
        nav ul li a:hover, nav ul li a.active { color: #ffcc00; }
        .dropdown-content { display: none; position: absolute; background: rgba(255, 255, 255, 0.2); min-width: 150px; box-shadow: 0 5px 10px rgba(0, 0, 0, 0.3); z-index: 1; border-radius: 5px; }
        .dropdown-content a { display: block; padding: 10px; color: white; text-align: left; }
        .dropdown:hover .dropdown-content { display: block; }
        .dashboard { padding: 20px; text-align: center; margin-top: 50px; flex-grow: 1; }
        .dashboard h1 { font-size: 32px; color: #ffcc00; }
        .events-container { 
            display: flex; 
            flex-wrap: wrap; 
            justify-content: center; 
            gap: 20px; 
            margin-top: 20px;
            padding-bottom: 100px; /* Make space for the footer */
        }
        .event-card { 
            background: rgba(255, 255, 255, 0.15); 
            backdrop-filter: blur(10px); 
            border-radius: 12px; 
            padding: 20px; 
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3); 
            text-align: left; 
            width: 300px; 
            margin-bottom: 20px; /* Prevent card overlap */
        }
        .event-card h3 { font-size: 1.5em; color: #ffcc00; }
        .event-card p { font-size: 1em; color: white; margin-bottom: 15px; }
        .btn { width: 100%; background: #ffcc00; color: black; padding: 12px; font-size: 18px; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; transition: 0.3s; }
        .btn:hover { background: #e6b800; transform: scale(1.05); }
        footer { 
            text-align: center; 
            padding: 15px; 
            font-size: 14px; 
            background: rgba(255, 255, 255, 0.15); 
            backdrop-filter: blur(10px); 
            position: relative; 
            bottom: 0; 
            width: 100%; 
            color: rgba(255, 255, 255, 0.7); 
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">Event Rating</div>
        <nav>
            <ul>
                <li><a href="/">Home</a></li>
                <li><a href="/logout">Logout</a></li>
            </ul>
        </nav>
    </header>

    <main class="dashboard">
        <h1>Welcome to Your Dashboard</h1>
        <p>Here are the upcoming events you can enroll in:</p>

        <div class="events-container" id="events-list">
            <!-- Events will be loaded here dynamically -->
        </div>
    </main>

    <footer>
        <p>&copy; 2025 Event Rating System | Designed for seamless experience</p>
    </footer>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            fetch("/get-events")
                .then(response => {
                    console.log('Response Status:', response.status);
                    if (!response.ok) {
                        throw new Error('Failed to fetch events. Status: ' + response.status);
                    }
                    return response.json(); // Parse response as JSON
                })
                .then(events => {
                    const eventList = document.getElementById("events-list");
                    if (events.length === 0) {
                        eventList.innerHTML = "<p>No upcoming events available.</p>";
                        return;
                    }
    
                    events.forEach(event => {
                        // ✅ Convert event date to readable format (without timezone)
                        const eventDate = new Date(event.event_datetime).toLocaleString("en-US", {
                            weekday: "short",
                            year: "numeric",
                            month: "short",
                            day: "numeric",
                            hour: "2-digit",
                            minute: "2-digit",
                            second: "2-digit"
                        });
    
                        // ✅ Create event card with location & formatted date
                        const eventCard = document.createElement("div");
                        eventCard.classList.add("event-card");
                        eventCard.innerHTML = `
                            <h3>${event.event_name}</h3>
                            <p>${event.event_description}</p>
                            <p><strong>Location:</strong> ${event.event_location}</p> <!-- ✅ Show event location -->
                            <p><strong>Event Date:</strong> ${eventDate}</p> <!-- ✅ Show formatted date (without GMT) -->
                            <button class="btn enroll-btn" data-id="${event.id}">Enroll</button>
                        `;
                        eventList.appendChild(eventCard);
                    });
    
                    // Handle enroll button clicks
                    document.querySelectorAll(".enroll-btn").forEach(button => {
                        button.addEventListener("click", (e) => {
                            const eventId = e.target.dataset.id;
                            fetch("/enroll", {
                                method: "POST",
                                headers: { "Content-Type": "application/json" },
                                body: JSON.stringify({ eventId })
                            })
                            .then(response => response.text()) // First, read the response as text
                            .then(text => {
                                try {
                                    const data = JSON.parse(text); // Try parsing as JSON
                                    if (data.message) {
                                        alert(data.message);
                                    } else {
                                        alert("Enrollment successful!");
                                    }
                                } catch (error) {
                                    console.error("JSON parsing error:", error);
                                    console.log("Response received:", text); // Debugging: Log actual response text
                                    if (text.includes("<!DOCTYPE html>")) {
                                        alert("You are not logged in. Redirecting to login page.");
                                        window.location.href = "/login"; // Redirect to login if response contains HTML
                                    } else {
                                        alert("Unexpected response from the server. Please try again.");
                                    }
                                }
                            })
                            .catch(error => {
                                console.error("Enrollment error:", error);
                                alert("There was an error enrolling in the event. Please try again later.");
                            });
                        });
                    });
                })
                .catch(error => {
                    console.error("Error fetching events:", error);
                    const eventList = document.getElementById("events-list");
                    eventList.innerHTML = "<p>There was an error loading events. Please try again later.</p>";
                });
        });
    </script>
    
    
   
</body>
</html>
