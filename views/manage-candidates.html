<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Candidates</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            color: white;
            text-align: center;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            background: rgba(255, 255, 255, 0.2);
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            backdrop-filter: blur(10px);
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            color: #ffcc00;
        }

        nav ul {
            list-style: none;
            display: flex;
        }

        nav ul li {
            margin: 0 15px;
        }

        nav ul li a {
            color: white;
            text-decoration: none;
            font-size: 18px;
            transition: 0.3s;
        }

        nav ul li a:hover,
        nav ul li a.active {
            color: #ffcc00;
        }

        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            width: 100%;
        }

        .dashboard-box {
            background: rgba(255, 255, 255, 0.15);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            width: 80%;
            max-width: 900px;
            min-height: 400px;
        }

        h2 {
            font-size: 28px;
            color: #ffcc00;
            margin-bottom: 15px;
        }

        table {
            width: 100%;
            margin-top: 20px;
            border-collapse: collapse;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            overflow: hidden;
        }

        th,
        td {
            padding: 12px;
            border: 1px solid white;
            text-align: center;
        }

        th {
            background: rgba(255, 255, 255, 0.3);
            color: #ffcc00;
        }

        td {
            background: rgba(255, 255, 255, 0.1);
        }

        tr:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        button {
            padding: 8px 12px;
            margin: 5px;
            border: none;
            cursor: pointer;
            border-radius: 5px;
            transition: 0.3s;
            font-size: 14px;
        }

        .btn-edit {
            background: #ffcc00;
            color: black;
        }

        .btn-delete {
            background: red;
            color: white;
        }

        .btn-edit:hover {
            background: #e6b800;
        }

        .btn-delete:hover {
            background: darkred;
        }

        .form-group {
            margin: 10px 0;
            text-align: left;
            width: 100%;
        }

        .form-group label {
            font-size: 16px;
            display: block;
            margin-bottom: 5px;
        }

        input {
            width: 100%;
            padding: 10px;
            border-radius: 5px;
            border: none;
            font-size: 16px;
        }

        .button-container {
            text-align: right;
            margin-top: 10px;
        }

        button[type="submit"] {
            padding: 10px 20px;
            font-size: 16px;
            background: #ffcc00;
            color: black;
            font-weight: bold;
            border-radius: 5px;
            transition: 0.3s;
            display: block;
            margin: auto;
        }

        button[type="submit"]:hover {
            background: #e6b800;
        }

        footer {
            text-align: center;
            padding: 15px;
            font-size: 14px;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            width: 100%;
            margin-top: auto;
        }
    </style>
</head>

<body>

    <header>
        <div class="logo">Event Rating System</div>
        <nav>
            <ul>
                <li><a href="/admin/dashboard">Dashboard</a></li>
                <li><a href="/logout">Logout</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <div class="dashboard-box">
            <h2>Manage Candidates</h2>

            <!-- Form for adding/updating a candidate -->
            <form id="candidateForm">
                <input type="hidden" id="candidateId">
                <div class="form-group">
                    <label for="name">Name:</label>
                    <input type="text" id="name" required>
                </div>
                <div class="form-group">
                    <label for="email">Email:</label>
                    <input type="email" id="email" required>
                </div>
                <div class="form-group">
                    <label for="password">Password:</label>
                    <input type="password" id="password" required>
                </div>
                <div class="button-container">
                    <button type="submit">Save Candidate</button>
                </div>
            </form>

            <!-- Candidates Table -->
            <table>
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="candidatesTable"></tbody>
            </table>
        </div>
    </main>

    <footer>
        <p>&copy; 2025 Event Rating System. All Rights Reserved.</p>
    </footer>

    <script>
        document.addEventListener("DOMContentLoaded", fetchCandidates);
    
        // Fetch candidates from the server
        async function fetchCandidates() {
            try {
                const response = await fetch("/candidates");
    
                // Ensure response is valid JSON
                if (!response.ok) {
                    throw new Error(`HTTP error! Status: ${response.status}`);
                }
    
                const data = await response.json();
                const table = document.getElementById("candidatesTable");
                table.innerHTML = "";
    
                data.forEach(candidate => {
                    table.innerHTML += `
                        <tr id="candidate-${candidate.id}">
                            <td>${candidate.name}</td>
                            <td>${candidate.email}</td>
                            <td>
                                <button class="btn-edit" onclick="editCandidate(${candidate.id}, '${candidate.name}', '${candidate.email}')">Edit</button>
                                <button class="btn-delete" onclick="deleteCandidate(${candidate.id})">Delete</button>
                            </td>
                        </tr>
                    `;
                });
            } catch (error) {
                console.error("Error fetching candidates:", error.message);
            }
        }
    
        // Delete a candidate
        async function deleteCandidate(id) {
            if (confirm("Are you sure you want to delete this candidate?")) {
                await fetch(`/candidates/${id}`, { method: "DELETE" });
                fetchCandidates();
            }
        }
    
        // Edit a candidate (populate form with existing data)
        function editCandidate(id, name, email) {
            document.getElementById("candidateId").value = id;
            document.getElementById("name").value = name;
            document.getElementById("email").value = email;
        }
    
        // Handle form submission (add/update candidate)
        document.getElementById("candidateForm").addEventListener("submit", async function(event) {
            event.preventDefault();
    
            const id = document.getElementById("candidateId").value;
            const name = document.getElementById("name").value;
            const email = document.getElementById("email").value;
            const password = document.getElementById("password").value;
    
            const candidateData = {
                name,
                email,
                password,
            };
    
            try {
                let response;
    
                if (id) {
                    // Update existing candidate
                    response = await fetch(`/candidates/${id}`, {
                        method: "PUT",
                        headers: {
                            "Content-Type": "application/json",
                        },
                        body: JSON.stringify(candidateData),
                    });
                } else {
                    // Create new candidate
                    response = await fetch("/candidates", {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json",
                        },
                        body: JSON.stringify(candidateData),
                    });
                }
    
                if (!response.ok) {
                    throw new Error("Failed to save candidate.");
                }
    
                // Reset form and refresh the candidate list
                document.getElementById("candidateForm").reset();
                fetchCandidates();
            } catch (error) {
                console.error("Error saving candidate:", error.message);
            }
        });
    </script>
    

</body>

</html>
