<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rate Events</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            color: white;
            text-align: center;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            background: rgba(255, 255, 255, 0.2);
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            backdrop-filter: blur(10px);
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            color: #ffcc00;
        }

        nav ul {
            list-style: none;
            display: flex;
        }

        nav ul li {
            margin: 0 15px;
        }

        nav ul li a {
            color: white;
            text-decoration: none;
            font-size: 18px;
            transition: 0.3s;
        }

        nav ul li a:hover,
        nav ul li a.active {
            color: #ffcc00;
        }

        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            width: 100%;
        }

        .dashboard-box {
            background: rgba(255, 255, 255, 0.15);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            width: 80%;
            max-width: 900px;
            min-height: 400px;
        }

        h2 {
            font-size: 28px;
            color: #ffcc00;
            margin-bottom: 15px;
        }

        table {
            width: 100%;
            margin-top: 20px;
            border-collapse: collapse;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            overflow: hidden;
        }

        th, td {
            padding: 12px;
            border: 1px solid white;
            text-align: center;
        }

        th {
            background: rgba(255, 255, 255, 0.3);
            color: #ffcc00;
        }

        td {
            background: rgba(255, 255, 255, 0.1);
        }

        tr:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .btn-rate {
            padding: 8px 12px;
            background: #ffcc00;
            color: black;
            border: none;
            cursor: pointer;
            border-radius: 5px;
            transition: 0.3s;
            font-size: 14px;
        }

        .btn-rate:hover {
            background: #e6b800;
        }

        footer {
            text-align: center;
            padding: 15px;
            font-size: 14px;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            width: 100%;
            margin-top: auto;
        }
    </style>
</head>

<body>

    <header>
        <div class="logo">Event Rating System</div>
        <nav>
            <ul>
                <li><a href="/judge/dashboard">Dashboard</a></li>
                <li><a href="/logout">Logout</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <div class="dashboard-box">
            <h2>Judge Dashboard</h2>

            <table>
                <thead>
                    <tr>
                        <th>Event Name</th>
                        <th>Date</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="eventsTable">
                    <tr><td colspan="3">Loading events...</td></tr>
                </tbody>
            </table>
        </div>
    </main>

    <footer>
        <p>&copy; 2025 Event Rating System. All Rights Reserved.</p>
    </footer>

    <script>
        document.addEventListener("DOMContentLoaded", fetchEvents);

        async function fetchEvents() {
            const table = document.getElementById("eventsTable");
            table.innerHTML = '<tr><td colspan="3">Loading events...</td></tr>'; // Show loading message

            try {
                const response = await fetch("/api/judge/events");

                if (!response.ok) {
                    throw new Error(`Failed to fetch events: ${response.statusText}`);
                }

                const data = await response.json();
                table.innerHTML = ""; // Clear table

                if (data.length === 0) {
                    table.innerHTML = '<tr><td colspan="3">No events available for rating.</td></tr>';
                    return;
                }

                data.forEach(event => {
                    table.innerHTML += `
                        <tr>
                            <td>${event.name}</td>
                            <td>${event.date}</td>
                            <td><button class="btn-rate" data-event-id="${event.id}">Rate</button></td>
                        </tr>
                    `;
                });

                // Attach event listeners after buttons are rendered
                document.querySelectorAll(".btn-rate").forEach(button => {
                    button.addEventListener("click", (event) => {
                        const eventId = event.target.getAttribute("data-event-id");

                        if (!eventId) {
                            alert("Event ID is missing.");
                            return;
                        }

                        window.location.href = `/judge/rate-candidate?eventId=${eventId}`;
                    });
                });

            } catch (error) {
                console.error("Error fetching events:", error);
                table.innerHTML = '<tr><td colspan="3" style="color:red;">Error loading events. Please try again.</td></tr>';
            }
        }
    </script>

</body>

</html>
