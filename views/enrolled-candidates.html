<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enrolled Candidates</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        /* ✅ FIXED LAYOUT TO PREVENT FOOTER OVERLAP */
        body {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            color: white;
        }

        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 20px;
        }

        header {
            background: rgba(255, 255, 255, 0.2);
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            backdrop-filter: blur(10px);
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            color: #ffcc00;
        }

        nav ul {
            list-style: none;
            display: flex;
        }

        nav ul li {
            margin: 0 15px;
        }

        nav ul li a {
            color: white;
            text-decoration: none;
            font-size: 18px;
            transition: 0.3s;
        }

        nav ul li a:hover {
            color: #ffcc00;
        }

        .container {
            max-width: 90%;
            width: 100%;
            margin-top: 20px;
        }

        h2 {
            font-size: 32px;
            color: #ffcc00;
            margin-bottom: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 8px;
            overflow: hidden;
        }

        th, td {
            padding: 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.3);
        }

        th {
            background: rgba(255, 255, 255, 0.2);
            color: #ffcc00;
        }

        td {
            color: white;
        }

        /* ✅ FIXED FOOTER TO STAY AT THE BOTTOM */
        footer {
            text-align: center;
            padding: 15px;
            font-size: 14px;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            color: rgba(255, 255, 255, 0.7);
        }
    </style>
</head>

<body>

    <header>
        <div class="logo">Event Rating System</div>
        <nav>
            <ul>
                <li><a href="/admin/dashboard">Dashboard</a></li>
                <li><a href="/logout">Logout</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <div class="container">
            <h2>Enrolled Candidates</h2>
            <table id="enrolledTable">
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Candidate Name</th>
                        <th>Email</th>
                        <th>Event Name</th>
                        <th>Event Date & Time</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Enrolled candidates will be loaded here -->
                </tbody>
            </table>
        </div>
    </main>

    <footer>
        <p>&copy; 2025 Event Rating System. All Rights Reserved.</p>
    </footer>

    <script>
        document.addEventListener("DOMContentLoaded", async () => {
            try {
                const response = await fetch("/api/enrolled-candidates");
                const candidates = await response.json();
                const tableBody = document.querySelector("#enrolledTable tbody");

                if (candidates.length === 0) {
                    tableBody.innerHTML = "<tr><td colspan='5'>No enrolled candidates available.</td></tr>";
                    return;
                }

                candidates.forEach((candidate, index) => {
                    const formattedDate = new Date(candidate.event_datetime).toLocaleString("en-US", {
                        weekday: "short",
                        year: "numeric",
                        month: "short",
                        day: "numeric",
                        hour: "2-digit",
                        minute: "2-digit",
                        second: "2-digit",
                        timeZoneName: "short"
                    });

                    const row = `
                        <tr>
                            <td>${index + 1}</td>
                            <td>${candidate.candidate_name}</td>
                            <td>${candidate.email}</td>
                            <td>${candidate.event_name}</td>
                            <td>${formattedDate}</td>
                        </tr>`;
                    tableBody.innerHTML += row;
                });

            } catch (error) {
                console.error("Error loading enrolled candidates:", error);
                alert("Failed to load enrolled candidates.");
            }
        });
    </script>

</body>
</html>
